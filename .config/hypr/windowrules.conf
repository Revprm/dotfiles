# █░█░█ █ █▄░█ █▀▄ █▀█ █░█░█   █▀█ █░█ █░░ █▀▀ █▀
# ▀▄▀▄▀ █ █░▀█ █▄▀ █▄█ ▀▄▀▄▀   █▀▄ █▄█ █▄▄ ██▄ ▄█

# '$&' is a hyde specific shorthand for "override"
$&=override

# ═══════════════════════════════════════════════════════════════════
# IDLE INHIBIT RULES
# ═══════════════════════════════════════════════════════════════════

windowrule = idleinhibit fullscreen, class:^(.*celluloid.*)$|^(.*mpv.*)$|^(.*vlc.*)$
windowrule = idleinhibit fullscreen, class:^(.*[Ss]potify.*)$
windowrule = idleinhibit fullscreen, class:^(.*LibreWolf.*)$|^(.*floorp.*)$|^(.*brave-browser.*)$|^(.*firefox.*)$|^(.*chromium.*)$|^(.*zen.*)$|^(.*vivaldi.*)$

# ═══════════════════════════════════════════════════════════════════
# PICTURE-IN-PICTURE
# ═══════════════════════════════════════════════════════════════════

windowrule = tag +picture-in-picture, title:^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$
windowrule = float,           tag:picture-in-picture
windowrule = keepaspectratio, tag:picture-in-picture
windowrule = move 73% 72%,    tag:picture-in-picture
windowrule = size 25%,        tag:picture-in-picture
windowrule = pin,             tag:picture-in-picture

# ═══════════════════════════════════════════════════════════════════
# OPACITY RULES
# ═══════════════════════════════════════════════════════════════════

# ─── Browsers (0.90) ───
windowrule = opacity 0.90 $& 0.90 $& 1, class:^(firefox)$
windowrule = opacity 0.90 $& 0.90 $& 1, class:^(brave-browser)$
windowrule = opacity 0.90 $& 0.90 $& 1, class:^(zen)$

# ─── Development Tools (0.80) ───
windowrule = opacity 0.80 $& 0.80 $& 1, class:^(code-oss)$
windowrule = opacity 0.80 $& 0.80 $& 1, class:^([Cc]ode)$
windowrule = opacity 0.80 $& 0.80 $& 1, class:^(code-url-handler)$
windowrule = opacity 0.80 $& 0.80 $& 1, class:^(code-insiders-url-handler)$
windowrule = opacity 0.80 $& 0.80 $& 1, class:^(kitty)$

# ─── File Managers & System Tools (0.80) ───
windowrule = opacity 0.80 $& 0.80 $& 1, class:^(org.kde.dolphin)$
windowrule = opacity 0.80 $& 0.80 $& 1, class:^(org.kde.ark)$
windowrule = opacity 0.80 $& 0.80 $& 1, class:^(nwg-look)$
windowrule = opacity 0.80 $& 0.80 $& 1, class:^(qt5ct)$
windowrule = opacity 0.80 $& 0.80 $& 1, class:^(qt6ct)$
windowrule = opacity 0.80 $& 0.80 $& 1, class:^(kvantummanager)$

# ─── System Settings & Applets (0.80/0.70) ───
windowrule = opacity 0.80 $& 0.70 $& 1, class:^(org.pulseaudio.pavucontrol)$
windowrule = opacity 0.80 $& 0.70 $& 1, class:^(blueman-manager)$
windowrule = opacity 0.80 $& 0.70 $& 1, class:^(nm-applet)$
windowrule = opacity 0.80 $& 0.70 $& 1, class:^(nm-connection-editor)$
windowrule = opacity 0.80 $& 0.70 $& 1, class:^(org.kde.polkit-kde-authentication-agent-1)$
windowrule = opacity 0.80 $& 0.70 $& 1, class:^(polkit-gnome-authentication-agent-1)$
windowrule = opacity 0.80 $& 0.70 $& 1, class:^(org.freedesktop.impl.portal.desktop.gtk)$
windowrule = opacity 0.80 $& 0.70 $& 1, class:^(org.freedesktop.impl.portal.desktop.hyprland)$

# ─── Gaming & Entertainment (0.70) ───
windowrule = opacity 0.70 $& 0.70 $& 1, class:^([Ss]team)$
windowrule = opacity 0.70 $& 0.70 $& 1, class:^(steamwebhelper)$
windowrule = opacity 0.70 $& 0.70 $& 1, class:^([Ss]potify)$
windowrule = opacity 0.70 $& 0.70 $& 1, initialTitle:^(Spotify Free)$
windowrule = opacity 0.70 $& 0.70 $& 1, initialTitle:^(Spotify Premium)$

# ─── GTK/Qt Applications (0.80-0.90) ───
windowrule = opacity 0.90 0.90, class:^(com.github.rafostar.Clapper)$     # Clapper
windowrule = opacity 0.80 0.80, class:^(com.github.tchx84.Flatseal)$     # Flatseal
windowrule = opacity 0.80 0.80, class:^(hu.kramo.Cartridges)$            # Cartridges
windowrule = opacity 0.80 0.80, class:^(com.obsproject.Studio)$          # OBS
windowrule = opacity 0.80 0.80, class:^(gnome-boxes)$                    # Boxes

# ─── Communication Apps (0.80) ───
windowrule = opacity 0.80 0.80, class:^(vesktop)$                        # Vesktop
windowrule = opacity 0.80 0.80, class:^(discord)$                        # Discord
windowrule = opacity 0.80 0.80, class:^(WebCord)$                        # WebCord
windowrule = opacity 0.80 0.80, class:^(ArmCord)$                        # ArmCord
windowrule = opacity 0.80 0.80, class:^(Signal)$                         # Signal

# ─── Utilities (0.80) ───
windowrule = opacity 0.80 0.80, class:^(app.drey.Warp)$                  # Warp
windowrule = opacity 0.80 0.80, class:^(net.davidotek.pupgui2)$          # ProtonUp-Qt
windowrule = opacity 0.80 0.80, class:^(yad)$                            # Protontricks
windowrule = opacity 0.80 0.80, class:^(io.github.alainm23.planify)$     # Planify
windowrule = opacity 0.80 0.80, class:^(io.gitlab.theevilskeleton.Upscaler)$ # Upscaler
windowrule = opacity 0.80 0.80, class:^(com.github.unrud.VideoDownloader)$ # VideoDownloader
windowrule = opacity 0.80 0.80, class:^(io.gitlab.adhami3310.Impression)$ # Impression
windowrule = opacity 0.80 0.80, class:^(io.missioncenter.MissionCenter)$ # MissionCenter
windowrule = opacity 0.80 0.80, class:^(io.github.flattool.Warehouse)$   # Warehouse

# ═══════════════════════════════════════════════════════════════════
# FLOAT RULES
# ═══════════════════════════════════════════════════════════════════

windowrule = float, class:^(Signal)$
windowrule = float, class:^(com.github.rafostar.Clapper)$
windowrule = float, class:^(app.drey.Warp)$
windowrule = float, class:^(net.davidotek.pupgui2)$
windowrule = float, class:^(yad)$
windowrule = float, class:^(eog)$
windowrule = float, class:^(io.github.alainm23.planify)$
windowrule = float, class:^(io.gitlab.theevilskeleton.Upscaler)$
windowrule = float, class:^(com.github.unrud.VideoDownloader)$
windowrule = float, class:^(io.gitlab.adhami3310.Impression)$
windowrule = float, class:^(io.missioncenter.MissionCenter)$

# ═══════════════════════════════════════════════════════════════════
# SPECIAL BEHAVIOR RULES
# ═══════════════════════════════════════════════════════════════════

# JetBrains IDEs - Fix dropdown flickering
windowrule = noinitialfocus, class:^(.*jetbrains.*)$,title:^(win[0-9]+)$

# Fullscreen for games
windowrule = fullscreen, class:^(steam_app_\d+)$|^(osu!)$

# ═══════════════════════════════════════════════════════════════════
# WORKSPACE ASSIGNMENTS
# ═══════════════════════════════════════════════════════════════════

# ─── Workspace 1: Development ───
windowrule = tag +development, class:^(code-oss)$
windowrule = tag +development, class:^([Cc]ode)$
windowrule = tag +development, class:^(code-url-handler)$
windowrule = tag +development, class:^(code-insiders-url-handler)$
windowrule = tag +development, class:^(jetbrains-.*)$
windowrule = tag +development, class:^(dev.zed.Zed)$
windowrule = workspace 1, tag:development

# ─── Workspace 2: Notes ───
windowrule = tag +notes, class:^(obsidian)$
windowrule = workspace 2, tag:notes

# ─── Workspace 3: Browsers ───
windowrule = tag +browsers, class:^(.*LibreWolf.*)$
windowrule = tag +browsers, class:^(.*floorp.*)$
windowrule = tag +browsers, class:^(.*brave-browser.*)$
windowrule = tag +browsers, class:^(.*firefox.*)$
windowrule = tag +browsers, class:^(.*chromium.*)$
windowrule = tag +browsers, class:^(.*zen.*)$
windowrule = tag +browsers, class:^(.*vivaldi.*)$
windowrule = workspace 3, tag:browsers

# ─── Workspace 4: Communication ───
windowrule = tag +communication, class:^(discord)$
windowrule = tag +communication, class:^(WebCord)$
windowrule = tag +communication, class:^(ArmCord)$
windowrule = tag +communication, class:^(vesktop)$
windowrule = tag +communication, class:^(com.discordapp.Discord)$
windowrule = workspace 4, tag:communication

# ─── Workspace 5: (Available) ───

# ─── Workspace 6: Steam ───
windowrule = tag +gameLaunchers, class:^([Ss]team)$
windowrule = tag +gameLaunchers, class:^(steamwebhelper)$
windowrule = tag +gameLaunchers, class:^(org.prismlauncher.PrismLauncher)$
windowrule = workspace 6, tag:gameLaunchers

# ─── Workspace 7: Gaming ───
windowrule = tag +gaming, class:^(.*wine.*)$
windowrule = tag +gaming, class:^(.*lutris.*)$
windowrule = tag +gaming, class:^(.*heroic.*)$
windowrule = tag +gaming, class:^(.*bottles.*)$
windowrule = tag +gaming, class:^(.*gamescope.*)$
windowrule = tag +gaming, class:^(.*proton.*)$
windowrule = tag +gaming, class:^(steam_app_\d+)$
windowrule = tag +gaming, class:^(osu!)$
windowrule = tag +gaming, class:^(steam_app_default)$
windowrule = tag +gaming, class:^(Minecraft.*)$
windowrule = workspace 7, tag:gaming

# ─── Workspace 8: WhatsApp ───
windowrule = tag +whatsapp, class:^(ZapZap)$
windowrule = workspace 8, tag:whatsapp

# ═══════════════════════════════════════════════════════════════════
# LAYER RULES
# ═══════════════════════════════════════════════════════════════════

# Rofi
layerrule = blur, rofi
layerrule = ignorezero, rofi

# Notifications
layerrule = blur, notifications
layerrule = ignorezero, notifications
layerrule = blur, swaync-notification-window
layerrule = ignorezero, swaync-notification-window
layerrule = blur, swaync-control-center
layerrule = ignorezero, swaync-control-center

# Logout dialog
layerrule = blur, logout_dialog