# vim:ft=kitty

# The basic colors

foreground              #abb2bf
background              #282c34
selection_foreground    #282c34
selection_background    #61afef

# Cursor
cursor                     none
cursor_blink_interval      -1
cursor_stop_blinking_after 15.0

# URL underline color when hovering with mouse
url_color               #61afef

active_tab_foreground   #282c34
active_tab_background   #61afef

inactive_tab_foreground #abb2bf
inactive_tab_background #282c34

tab_bar_edge bottom
active_tab_font_style   bold
tab_bar_style slant
tab_bar_background #282c34

# OS Window titlebar colors
wayland_titlebar_color system
macos_titlebar_color system


# The 16 terminal colors

# black
color0 #282c34
color8 #393e48

# red
color1 #e06c75
color9 #e06c75

# green
color2  #98c379
color10 #98c379

# yellow
color3  #e5c07b
color11 #e5c07b

# blue
color4  #61afef
color12 #61afef

# magenta
color5  #c678dd
color13 #c678dd

# cyan
color6  #56b6c2
color14 #56b6c2

# white
color7  #abb2bf
color15 #ffffff